                            <h3 class="heading-3">Nenhum livro na biblioteca</h3>
                            <p class="text-secondary">Adicione livros para ver o diário de leitura</p>
                        </div>
                    `;
                    return;
                }

                // Se não há livro selecionado, escolher um padrão
                if (!state.selectedBook || !books.findById(state.selectedBook)) {
                    const currentBook = books.getCurrentReading();
                    const fallbackBook = currentBook || state.books[0];
                    if (fallbackBook) {
                        state.selectedBook = fallbackBook.id;
                    }
                }

                const selectedBook = books.findById(state.selectedBook);

                const selectorHtml = state.books.map(book => `
                    <div class="book-option ${book.id === state.selectedBook ? 'selected' : ''}" data-action="select-diary-book" data-book="${book.id}">
                        <div class="flex gap-3">
                            <div class="book-cover">📖</div>
                            <div>
                                <h4 class="heading-3" style="font-size: 14px;">${book.title}</h4>
                                <p class="text-secondary">${book.author}</p>
                                <span class="status status-${book.status}">${utils.getStatusLabel(book.status)}</span>
                            </div>
                        </div>
                    </div>
                `).join('');

                selectorContainer.innerHTML = `
                    <div class="mb-6">
                        <h3 class="heading-3 mb-4">Selecionar livro:</h3>
                        ${selectorHtml}
                    </div>
                `;

                if (selectedBook) {
                    this.bookDiary(selectedBook, contentContainer);
                } else {
                    contentContainer.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">📝</div>
                            <h3 class="heading-3">Selecione um livro</h3>
                            <p class="text-secondary">Escolha um livro acima para ver seu diário</p>
                        </div>
                    `;
                }
            },

            bookDiary(book, container) {
                const bookSessions = sessions.getByBook(book.id);
                const completion = utils.getCompletionPercentage(book.currentPage, book.totalPages);

                let html = `
                    <div class="card card-padding mb-6">
                        <div class="flex gap-4 mb-4">
                            <div class="book-cover-lg">📖</div>
                            <div style="flex: 1;">
                                <h2 class="heading-2">${book.title}</h2>
                                <p class="text-secondary text-reading">${book.author}</p>
                                ${book.dateStarted ? `<p class="text-muted">Iniciado em ${utils.formatDate(book.dateStarted)}</p>` : ''}
                            </div>
                        </div>

                        ${book.status === 'lendo' || book.status === 'pausado' ? `
                            <div class="mb-4">
                                <div class="progress-text">
                                    ${book.status === 'pausado' ? 'Leitura pausada' : 'Progresso atual'} - ${completion}%
                                </div>
                                <div class="progress mb-2">
                                    <div class="progress-bar" style="width: ${completion}%"></div>
                                </div>
                                <p class="text-muted">Página ${book.currentPage} de ${book.totalPages}</p>
                                ${book.status === 'pausado' && book.datePaused ? `
                                    <p class="text-muted">Em pausa desde ${utils.formatDate(book.datePaused)}</p>
                                ` : ''}
                            </div>
                        ` : ''}

                        ${book.status === 'lido' ? `
                            <div class="mb-4" style="background: var(--accent-light); padding: 16px; border-radius: var(--radius);">
                                <div class="flex justify-between items-center">
                                    <div>
                                        ${book.dateFinished ? `
                                            <p style="color: var(--accent-primary); font-weight: 500;">
                                                🎉 Livro concluído em ${utils.formatDate(book.dateFinished)}
                                            </p>
                                        ` : `
                                            <p style="color: var(--accent-primary); font-weight: 500;">
                                                🎉 Livro concluído
                                            </p>
                                        `}
                                        ${book.rating && book.rating > 0 ? `
                                            <div class="rating-display" style="margin-top: 12px;">
                                                <span style="color: var(--accent-primary); font-weight: 500;">Sua avaliação:</span>
                                                ${utils.renderStars(book.rating)}
                                            </div>
                                        ` : ''}
                                    </div>
                                    <button class="btn btn-ghost btn-small" data-action="rate-book" data-book="${book.id}">
                                        ${book.rating && book.rating > 0 ? '✏️ Editar avaliação' : '⭐ Avaliar'}
                                    </button>
                                </div>
                            </div>
                        ` : ''}
                    </div>

                    <div class="card card-padding">
                        <h3 class="heading-3 mb-6">Histórico de Leitura</h3>
                `;

                if (bookSessions.length > 0) {
                    html += '<div class="timeline">';
                    
                    bookSessions.forEach(session => {
                        const moodEmoji = session.mood === 'good' ? '😊' : 
                                        session.mood === 'neutral' ? '😐' : 
                                        session.mood === 'bad' ? '😞' : '';

                        html += `
                            <div class="timeline-item">
                                <div class="session-card">
                                    <div class="flex justify-between items-start mb-2">
                                        <div>
                                            <p class="heading-3" style="font-size: 14px;">${session.pagesRead} páginas lidas</p>
                                            <p class="text-muted">${utils.formatDateLong(session.dateRead)}</p>
                                        </div>
                                        ${moodEmoji ? `<span style="font-size: 20px;">${moodEmoji}</span>` : ''}
                                    </div>
                                    
                                    ${session.notes ? `
                                        <div style="background: var(--bg-secondary); padding: 12px; border-radius: var(--radius); border-left: 4px solid var(--accent-primary); font-style: italic; color: var(--text-secondary);">
                                            "${session.notes}"
                                        </div>
                                    ` : ''}
                                </div>
                            </div>
                        `;
                    });
                    
                    html += '</div>';
                } else {
                    html += `
                        <div class="empty-state">
                            <div class="empty-icon">📝</div>
                            <h3 class="heading-3">Nenhuma sessão registrada</h3>
                            <p class="text-secondary">Comece a ler para criar seu histórico!</p>
                        </div>
                    `;
                }

                html += '</div>';
                container.innerHTML = html;
            }
        };

        // ========================================
        // ACTIONS
        // ========================================
        
        const actions = {
            showView(viewName) {
                // Hide all views
                document.querySelectorAll('[id$="-view"]').forEach(view => {
                    view.classList.add('hidden');
                });
                
                // Show selected view
                document.getElementById(viewName + '-view').classList.remove('hidden');
                
                // Update navigation
                document.querySelectorAll('.nav-item').forEach(item => {
                    item.classList.remove('active');
                });
                document.querySelector(`[data-view="${viewName}"]`).classList.add('active');
                
                state.currentView = viewName;

                // Render content
                if (viewName === 'today') {
                    render.today();
                } else if (viewName === 'library') {
                    render.library();
                } else if (viewName === 'diary') {
                    render.diary();
                }
            },

            openModal(modalId) {
                const modal = document.getElementById(modalId);
                modal.classList.remove('hidden');
                utils.focusFirst(modal);
            },

            closeModal() {
                document.querySelectorAll('.modal-overlay').forEach(modal => {
                    modal.classList.add('hidden');
                });
                this.closeAllDropdowns();
                this.resetForms();
            },

            closeAllDropdowns() {
                document.querySelectorAll('.dropdown-menu').forEach(menu => {
                    menu.classList.add('hidden');
                });
                // FIX: Remover dropdown-open de todos os cards quando fechar menus
                document.querySelectorAll('.card.dropdown-open').forEach(card => {
                    card.classList.remove('dropdown-open');
                });
            },

            resetForms() {
                // Reading session form
                document.getElementById('pages-input').value = '';
                document.getElementById('notes-input').value = '';
                state.selectedMood = '';
                state.selectedRating = 0;
                state.ratingBookId = null;
                state.readingBookId = null;  // CRÍTICO: Limpar ao fechar modal
                this.updateMoodButtons();

                // Book form
                ['book-title', 'book-author', 'book-pages', 'book-date-started', 'book-date-finished'].forEach(id => {
                    document.getElementById(id).value = '';
                });
                document.getElementById('book-priority').value = '2';
                document.getElementById('book-status').value = 'quero_ler';
                
                state.editingBook = null;
            },

            openReadingModal(bookId) {
                const book = books.findById(bookId);
                if (!book) {
                    utils.showToast('Livro não encontrado.');
                    return;
                }

                // CRÍTICO: Sempre definir qual livro receberá a sessão
                state.readingBookId = bookId;

                const bookInfo = document.getElementById('current-book-info');
                bookInfo.innerHTML = `
                    <div style="background: var(--accent-light); padding: 16px; border-radius: var(--radius); border-left: 4px solid var(--accent-primary);">
                        <p class="heading-3" style="font-size: 15px; margin-bottom: 4px;">${book.title}</p>
                        <p class="text-muted">Você estava na página ${book.currentPage} de ${book.totalPages}</p>
                        ${book.status === 'pausado' ? `
                            <p class="text-muted" style="color: var(--warning); margin-top: 8px;">
                                💡 Dica: comece com poucas páginas para retomar o ritmo
                            </p>
                        ` : ''}
                    </div>
                `;

                this.openModal('reading-modal');
                
                // Focus sem cloneNode (removido para evitar gambiarras)
                setTimeout(() => {
                    const input = document.getElementById('pages-input');
                    input.focus();
                    input.select();
                }, 150);
            },

            saveSession() {
                const pagesInput = document.getElementById('pages-input');
                const notes = document.getElementById('notes-input').value;
                
                const pagesRead = parseInt(pagesInput.value);
                
                // Validação robusta de entrada
                if (!pagesRead || isNaN(pagesRead) || pagesRead <= 0) {
                    utils.showToast('Por favor, insira um número válido de páginas (maior que 0).');
                    pagesInput.focus();
                    return;
                }

                // CRÍTICO: Usar readingBookId em vez de getCurrentReading()
                if (!state.readingBookId) {
                    utils.showToast('Erro: livro não identificado.');
                    return;
                }

                const book = books.findById(state.readingBookId);
                if (!book) {
                    utils.showToast('Erro: livro não encontrado.');
                    return;
                }

                // Calcular páginas restantes e fazer clamp se necessário
                const pagesRemaining = book.totalPages - book.currentPage;
                let actualPagesRead = pagesRead;
                let adjustmentMessage = '';

                if (pagesRead > pagesRemaining && pagesRemaining > 0) {
                    actualPagesRead = pagesRemaining;
                    adjustmentMessage = ` (ajustado de ${pagesRead} para ${actualPagesRead} - era o restante para concluir)`;
                }

                const sessionData = {
                    bookId: state.readingBookId,
                    pagesRead: actualPagesRead,
                    notes: notes.trim(),
                    mood: state.selectedMood
                };

                const session = sessions.create(sessionData);

                this.closeModal();

                const updatedBook = books.findById(state.readingBookId);
                if (updatedBook.status === 'lido') {
                    utils.showToast(`🎉 Parabéns! Você terminou "${updatedBook.title}"!`);
                } else {
                    utils.showToast(`✅ ${actualPagesRead} páginas registradas${adjustmentMessage}!`);
                }

                this.showView(state.currentView);
            },

            openBookModal(bookId = null) {
                const title = document.getElementById('book-modal-title');
                
                if (bookId) {
                    const book = books.findById(bookId);
                    if (!book) return;
                    
                    state.editingBook = bookId;
                    title.textContent = 'Editar Livro';
                    
                    document.getElementById('book-title').value = book.title;
                    document.getElementById('book-author').value = book.author;
                    document.getElementById('book-pages').value = book.totalPages;
                    document.getElementById('book-priority').value = book.priority;
                    document.getElementById('book-status').value = book.status;
                    
                    // Preencher campos de data (converter ISO para format YYYY-MM-DD)
                    document.getElementById('book-date-started').value = utils.dateToInput(book.dateStarted);
                    document.getElementById('book-date-finished').value = utils.dateToInput(book.dateFinished);
                } else {
                    title.textContent = 'Adicionar Livro';
                }

                this.openModal('book-modal');
            },

            saveBook() {
                const title = document.getElementById('book-title').value.trim();
                const author = document.getElementById('book-author').value.trim();
                const pages = document.getElementById('book-pages').value;
                const priority = document.getElementById('book-priority').value;
                const status = document.getElementById('book-status').value;
                
                if (!title || !author || !pages) {
                    utils.showToast('Por favor, preencha todos os campos obrigatórios.');
                    return;
                }

                // Processar datas opcionais
                const dateStarted = utils.inputToDate(document.getElementById('book-date-started').value);
                const dateFinished = utils.inputToDate(document.getElementById('book-date-finished').value);

                const bookData = {
                    title,
                    author,
                    totalPages: parseInt(pages),
                    priority: parseInt(priority),
                    status,
                    dateStarted, // pode ser null
                    dateFinished: status === 'lido' ? dateFinished : null // só salvar se status for "lido"
                };

                if (state.editingBook) {
                    books.update(state.editingBook, bookData);
                    utils.showToast(`📚 "${title}" atualizado!`);
                } else {
                    books.create(bookData);
                    utils.showToast(`📚 "${title}" adicionado à biblioteca!`);
                }

                this.closeModal();
                this.showView(state.currentView);
            },

            confirmDelete(bookId) {
                const book = books.findById(bookId);
                if (!book) return;

                document.getElementById('confirm-title').textContent = 'Excluir Livro';
                document.getElementById('confirm-message').textContent = 
                    `Tem certeza que deseja excluir "${book.title}"? Esta ação não pode ser desfeita.`;
                
                document.getElementById('confirm-action').onclick = () => {
                    books.delete(bookId);
                    utils.showToast(`🗑️ "${book.title}" excluído.`);
                    this.closeModal();
                    this.showView(state.currentView);
                };

                this.openModal('confirm-modal');
            },

            updateMoodButtons() {
                document.querySelectorAll('.mood-btn').forEach(btn => {
                    const isSelected = btn.dataset.mood === state.selectedMood;
                    if (isSelected) {
                        btn.classList.remove('btn-ghost');
                        btn.classList.add('btn-secondary');
                    } else {
                        btn.classList.remove('btn-secondary');
                        btn.classList.add('btn-ghost');
                    }
                });
            },

            updatePageProgress() {
                const pagesInput = document.getElementById('pages-input');
                const progressDiv = document.getElementById('page-progress');
                
                if (!pagesInput || !progressDiv) return;
                
                // Usar readingBookId em vez de getCurrentReading
                const book = state.readingBookId ? books.findById(state.readingBookId) : null;
                const inputValue = parseInt(pagesInput.value);
                
                if (!book || !inputValue || inputValue < 1) {
                    progressDiv.textContent = '';
                    return;
                }
                
                const newPage = Math.min(
                    book.currentPage + inputValue, 
                    book.totalPages
                );
                
                const completion = utils.getCompletionPercentage(newPage, book.totalPages);
                
                if (newPage >= book.totalPages) {
                    progressDiv.innerHTML = `
                        <span style="color: var(--accent-primary); font-weight: 600;">
                            🎉 Você vai terminar o livro! (página ${book.currentPage} → ${newPage})
                        </span>
                    `;
                } else {
                    progressDiv.innerHTML = `
                        Página ${book.currentPage} → <strong>${newPage}</strong> (${completion}% concluído)
                    `;
                }
            },

            showRatingModal(bookId) {
                const book = books.findById(bookId);
                if (!book || book.status !== 'lido') return;

                state.ratingBookId = bookId;
                state.selectedRating = book.rating || 0; // Pré-selecionar rating existente

                const bookInfo = document.getElementById('rating-book-info');
                bookInfo.innerHTML = `
                    <div style="background: var(--accent-light); padding: 16px; border-radius: var(--radius); text-center;">
                        <p class="heading-3" style="font-size: 16px; margin-bottom: 4px;">📚 "${book.title}"</p>
                        <p class="text-secondary">${book.author}</p>
                        ${book.rating ? `<p class="text-muted" style="margin-top: 8px;">Avaliação atual: ${book.rating} estrela${book.rating > 1 ? 's' : ''}</p>` : ''}
                    </div>
                `;

                this.updateRatingStars();
                this.openModal('rating-modal');
            },

            updateRatingStars() {
                document.querySelectorAll('.rating-stars .star').forEach((star, index) => {
                    const rating = parseInt(star.dataset.rating);
                    if (rating <= state.selectedRating) {
                        star.classList.add('active');
                        star.textContent = '⭐';
                    } else {
                        star.classList.remove('active');
                        star.textContent = '☆';
                    }
                });

                const label = document.getElementById('rating-label');
                if (state.selectedRating === 0) {
                    label.textContent = 'Clique nas estrelas para avaliar';
                } else {
                    const ratingTexts = {
                        1: 'Não gostei',
                        2: 'Foi ok',
                        3: 'Gostei',
                        4: 'Muito bom',
                        5: 'Excelente'
                    };
                    label.textContent = ratingTexts[state.selectedRating] || '';
                }
            },

            saveRating() {
                if (!state.ratingBookId) return;

                const book = books.findById(state.ratingBookId);
                if (!book || book.status !== 'lido') return;

                // Salvar rating (ou remover se for 0)
                if (state.selectedRating > 0) {
                    books.update(state.ratingBookId, { rating: state.selectedRating });
                    utils.showToast(`📝 Avaliação salva: ${state.selectedRating} estrela${state.selectedRating > 1 ? 's' : ''}!`);
                } else {
                    books.update(state.ratingBookId, { rating: null });
                    utils.showToast('📚 Avaliação removida.');
                }

                this.closeModal();
                this.showView(state.currentView);
            },

            removeRating() {
                state.selectedRating = 0;
                this.updateRatingStars();
            },

            skipRating() {
                utils.showToast('📚 Obrigado pela leitura!');
                this.closeModal();
                this.showView(state.currentView);
            },

            // Funções de backup
            exportData() {
                try {
                    const exportData = {
                        books: state.books,
                        sessions: state.sessions,
                        settings: state.settings,
                        exportVersion: 1,
                        exportDate: new Date().toISOString(),
                        appName: 'ReadFlow'
                    };

                    const dataStr = JSON.stringify(exportData, null, 2);
                    const dataBlob = new Blob([dataStr], { type: 'application/json' });
                    
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(dataBlob);
                    link.download = `readflow-backup-${new Date().toISOString().split('T')[0]}.json`;
                    link.click();
                    
                    URL.revokeObjectURL(link.href);
                    utils.showToast('📥 Backup exportado com sucesso!');
                } catch (e) {
                    utils.showToast('Erro ao exportar backup.', 'error');
                    console.error('Export error:', e);
                }
            },

            importData(file) {
                if (!file || file.type !== 'application/json') {
                    utils.showToast('Por favor, selecione um arquivo JSON válido.');
                    return;
                }

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const importedData = JSON.parse(e.target.result);
                        
                        // Validação básica
                        if (!importedData.books || !Array.isArray(importedData.books) ||
                            !importedData.sessions || !Array.isArray(importedData.sessions)) {
                            utils.showToast('Arquivo de backup inválido: formato incorreto.');
                            return;
                        }

                        // Confirmação antes de importar
                        document.getElementById('confirm-title').textContent = 'Importar Backup';
                        document.getElementById('confirm-message').innerHTML = `
                            Tem certeza que deseja importar este backup?<br><br>
                            <strong>Dados atuais serão substituídos:</strong><br>
                            • ${state.books.length} livros → ${importedData.books.length} livros<br>
                            • ${state.sessions.length} sessões → ${importedData.sessions.length} sessões<br><br>
                            Esta ação não pode ser desfeita.
                        `;
                        
                        document.getElementById('confirm-action').onclick = () => {
                            // Substituir dados
                            state.books = importedData.books;
                            state.sessions = importedData.sessions;
                            state.settings = importedData.settings || { weeklyGoalPages: 0 };
                            
                            storage.save();
                            this.closeModal();
                            this.showView(state.currentView);
                            utils.showToast('📤 Backup importado com sucesso!');
                        };

                        this.openModal('confirm-modal');
                        
                    } catch (e) {
                        utils.showToast('Erro ao ler arquivo: formato JSON inválido.');
                        console.error('Import error:', e);
                    }
                };
                
                reader.readAsText(file);
            },

            setWeeklyGoal() {
                // Usar modal confirm existente como input
                document.getElementById('confirm-title').textContent = 'Meta semanal';
                document.getElementById('confirm-message').innerHTML = `
                    <div class="form-group">
                        <label for="weekly-goal-input" class="form-label">Páginas por semana:</label>
                        <input type="number" id="weekly-goal-input" min="0" 
                               class="form-input" value="${state.settings.weeklyGoalPages || ''}" 
                               placeholder="Ex: 70">
                        <p class="text-muted mt-2">Use 0 para remover a meta.</p>
                    </div>
                `;
                
                // Mudar botão para "Salvar"
                document.getElementById('confirm-action').textContent = 'Salvar';
                
                // Configurar ação do botão
                document.getElementById('confirm-action').onclick = () => {
                    const goalInput = document.getElementById('weekly-goal-input');
                    const goalPages = parseInt(goalInput.value) || 0;
                    
                    if (goalPages < 0) {
                        utils.showToast('Por favor, insira um número válido (0 ou maior).');
                        return;
                    }
                    
                    // Salvar meta
                    state.settings.weeklyGoalPages = goalPages;
                    storage.save();
                    
                    // Fechar modal
                    actions.closeModal();
                    
                    // Mensagem de confirmação
                    if (goalPages === 0) {
                        utils.showToast('Meta semanal removida.');
                    } else {
                        utils.showToast(`Meta semanal definida: ${goalPages} páginas.`);
                    }
                    
                    // Re-renderizar view
                    actions.showView(state.currentView);
                };
                
                // Abrir modal
                actions.openModal('confirm-modal');
                
                // Focar no input
                setTimeout(() => {
                    document.getElementById('weekly-goal-input').focus();
                }, 150);
            }
        };

        // ========================================
        // EVENT HANDLERS
        // ========================================
        
        function handleAction(e) {
            // FIX: Usar closest para encontrar elemento com data-action (resolve cliques em filhos)
            const actionElement = e.target.closest('[data-action]');
            if (!actionElement) return;
            
            const action = actionElement.dataset.action;
            const bookId = actionElement.dataset.book;
            
            e.preventDefault();
            
            // FIX: Só fechar dropdowns automaticamente se NÃO for toggle-menu
            if (action !== 'toggle-menu') {
                actions.closeAllDropdowns();
            }

            switch (action) {
                case 'add-book':
                    actions.openBookModal();
                    break;
                case 'edit-book':
                    actions.openBookModal(bookId);
                    break;
                case 'save-book':
                    actions.saveBook();
                    break;
                case 'register-reading':
                    actions.openReadingModal(bookId);
                    break;
                case 'save-session':
                    actions.saveSession();
                    break;
                case 'start-reading':
                    books.startReading(bookId);
                    utils.showToast('📖 Leitura iniciada!');
                    actions.showView(state.currentView);
                    break;
                case 'pause-book':
                    books.pause(bookId);
                    utils.showToast('⏸️ Livro pausado.');
                    actions.showView(state.currentView);
                    break;
                case 'resume-book':
                    books.startReading(bookId);
                    utils.showToast('▶️ Leitura retomada!');
                    actions.showView(state.currentView);
                    break;
                case 'view-diary':
                    if (bookId) {
                        state.selectedBook = bookId;
                    }
                    actions.showView('diary');
                    break;
                case 'select-diary-book':
                    if (bookId) {
                        state.selectedBook = bookId;
                        render.diary();
                    }
                    break;
                case 'confirm-delete':
                    actions.confirmDelete(bookId);
                    break;
                case 'close-modal':
                    actions.closeModal();
                    break;
                case 'toggle-menu':
                    // FIX: Implementar toggle inteligente
                    const targetMenu = document.getElementById(`menu-${bookId}`);
                    const targetCard = actionElement.closest('.card');
                    const isCurrentlyOpen = !targetMenu.classList.contains('hidden');
                    
                    // Fechar todos os outros menus e remover dropdown-open de todos os cards
                    document.querySelectorAll('.dropdown-menu').forEach(menu => {
                        if (menu !== targetMenu) {
                            menu.classList.add('hidden');
                        }
                    });
                    document.querySelectorAll('.card.dropdown-open').forEach(card => {
                        if (card !== targetCard) {
                            card.classList.remove('dropdown-open');
                        }
                    });
                    
                    // Toggle apenas o menu clicado
                    if (isCurrentlyOpen) {
                        targetMenu.classList.add('hidden');
                        targetCard.classList.remove('dropdown-open');
                    } else {
                        targetMenu.classList.remove('hidden');
                        targetCard.classList.add('dropdown-open');
                    }
                    break;
                case 'skip-rating':
                    actions.skipRating();
                    break;
                case 'save-rating':
                    actions.saveRating();
                    break;
                case 'remove-rating':
                    actions.removeRating();
                    break;
                case 'rate-book':
                    actions.showRatingModal(bookId);
                    break;
                case 'set-weekly-goal':
                    actions.setWeeklyGoal();
                    break;
                case 'export-data':
                    actions.exportData();
                    break;
                case 'import-data':
                    const fileInput = document.getElementById('import-file');
                    if (fileInput) {
                        fileInput.click();
                    }
                    break;
                case 'back-to-today':
                    actions.showView('today');
                    break;
            }
        }

        // Handler específico para mudanças no input de arquivo
        function handleFileImport(e) {
            if (e.target.id === 'import-file' && e.target.files.length > 0) {
                actions.importData(e.target.files[0]);
                e.target.value = ''; // Reset input
            }
        }

        function handleNavigation(e) {
            const view = e.target.closest('[data-view]')?.dataset.view;
            if (view) {
                actions.showView(view);
            }
        }

        function handleQuickPages(e) {
            const pages = e.target.dataset.quickPages;
            if (pages) {
                document.getElementById('pages-input').value = pages;
                actions.updatePageProgress();
            }
        }

        function handleMood(e) {
            const mood = e.target.dataset.mood;
            if (mood) {
                state.selectedMood = state.selectedMood === mood ? '' : mood;
                actions.updateMoodButtons();
            }
        }

        function handleRating(e) {
            const star = e.target.closest('.rating-stars .star');
            if (star) {
                const clickedRating = parseInt(star.dataset.rating);
                
                // Se clicou na mesma estrela que já estava selecionada, zerar
                if (state.selectedRating === clickedRating) {
                    state.selectedRating = 0;
                } else {
                    state.selectedRating = clickedRating;
                }
                
                actions.updateRatingStars();
            }
        }

        function handleLibraryFilter(e) {
            const tabElement = e.target.closest('.tab');
            if (tabElement) {
                const status = tabElement.dataset.status;
                if (status !== state.libraryFilter.status) {
                    state.libraryFilter.status = status;
                    
                    // Update tab visual state
                    document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
                    tabElement.classList.add('active');
                    
                    render.library();
                }
            }
        }

        // ========================================
        // INITIALIZATION
        // ========================================
        
        function init() {
            storage.load();
            
            // Event delegation
            document.addEventListener('click', handleAction);
            document.addEventListener('click', handleNavigation);
            document.addEventListener('click', handleQuickPages);
            document.addEventListener('click', handleMood);
            document.addEventListener('click', handleRating);
            document.addEventListener('click', handleLibraryFilter);
            
            // Event delegation para input de arquivo (funciona com elementos criados dinamicamente)
            document.addEventListener('change', handleFileImport);
            
            // Close dropdowns when clicking outside
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.dropdown')) {
                    actions.closeAllDropdowns();
                }
            });

            // Close modals with Escape
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    actions.closeModal();
                }
            });

            // Search functionality with better debounce
            const searchInput = document.getElementById('search-input');
            let searchTimeout;
            searchInput.addEventListener('input', (e) => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    state.libraryFilter.search = e.target.value.trim();
                    render.library();
                }, 300);
            });

            // Sort functionality
            document.getElementById('sort-select').addEventListener('change', (e) => {
                state.libraryFilter.sort = e.target.value;
                render.library();
            });

            // Modal reading session listeners (UMA ÚNICA VEZ para evitar duplicação)
            const pagesInput = document.getElementById('pages-input');
            
            // Enter para salvar
            pagesInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    // Só salvar se modal estiver visível
                    const modal = document.getElementById('reading-modal');
                    if (!modal.classList.contains('hidden')) {
                        actions.saveSession();
                    }
                }
            });
            
            // Input para atualizar progresso
            pagesInput.addEventListener('input', () => {
                // Só atualizar se modal estiver visível
                const modal = document.getElementById('reading-modal');
                if (!modal.classList.contains('hidden')) {
                    actions.updatePageProgress();
                }
            });

            // Initial render
            actions.showView('today');
        }

        // Start the app
        init();
    </script>
</body>
</html>
